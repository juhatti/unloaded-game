<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNLOADED</title>
  <!-- Pixel Art Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      background-color: #1a0f0a;
      color: #f4c430;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      padding: 20px;
      margin: 0;
      transition: background-color 0.5s ease;
    }
    body.stealth-mode {
      background-color: #000000 !important;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 25px;
      text-shadow: 3px 3px #000;
    }
    .card {
      background: #2b170e;
      border: 4px solid #8b4513;
      padding: 20px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 8px 0 #000;
      transition: opacity 0.5s ease;
    }
    .stealth-mode .card {
      background: #000000;
      border-color: #111111;
      box-shadow: none;
    }
    .stealth-hidden {
      opacity: 0.05;
      pointer-events: none;
    }
    button {
      background: #8b4513;
      color: #fff;
      border: 2px solid #f4c430;
      padding: 14px;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      cursor: pointer;
      margin: 10px 0;
      width: 100%;
    }
    button:active {
      transform: translateY(2px);
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background: #000;
      color: #fff;
      border: 2px solid #8b4513;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      text-align: center;
    }
    .player-list {
      list-style: none;
      padding: 0;
      margin: 15px 0;
      text-align: left;
    }
    .player-item {
      padding: 10px;
      margin: 6px 0;
      background: #1a0f0a;
      border: 1px solid #8b4513;
      font-size: 9px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      line-height: 1.4;
    }
    .player-self {
      color: #ffffff !important;
      font-weight: bold;
      border-color: #f4c430;
    }
    .status-ready { color: #4caf50; }
    .status-moving { color: #ff9800; }
    .status-dead { color: #f44336; font-weight: bold; }
    .status-box {
      margin-top: 20px;
      font-size: 11px;
      line-height: 1.6;
      color: #d7ccc8;
    }
    .room-code {
      color: #fff;
      background: #000;
      padding: 4px 8px;
      border: 1px dashed #f4c430;
    }
    .live-timer {
      font-size: 20px;
      color: #4caf50;
      margin: 10px 0;
      text-shadow: 2px 2px #000;
    }
    .winner-box {
      color: #ffd700;
      font-size: 12px;
      line-height: 1.8;
      border: 2px dashed #ffd700;
      padding: 15px;
      margin-top: 15px;
      background: #110d00;
    }
  </style>

  <!-- Google Firebase Web SDK (v9 Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body>

  <h1>UNLOADED</h1>

  <!-- SETUP SCREEN -->
  <div id="setup-screen" class="card">
    <input type="text" id="player-name" placeholder="ENTER ALIAS..." maxlength="12">
    <button onclick="createRoom()">CREATE SALOON (HOST)</button>
    <hr style="border-color: #8b4513; margin: 15px 0;">
    <input type="text" id="room-code-input" placeholder="ROOM CODE (E.G. A1B2)" style="text-transform: uppercase;">
    <button onclick="joinRoom()">JOIN DUEL</button>
  </div>

  <!-- LOBBY & DUEL SCREEN -->
  <div id="room-screen" class="card" style="display:none;">
    <div style="font-size: 12px; margin-bottom: 15px;">
      SALOON CODE: <span id="display-room-code" class="room-code">-</span>
    </div>

    <button id="perm-btn" onclick="requestMotionPermission()">ENABLE SENSOR & WAKE LOCK</button>
    
    <p id="sensor-instruction" style="font-size: 8px; line-height: 1.5; color: #a87d4f; margin: 15px 0;">
      Place your phone face down on the table! Keep it completely still.
    </p>

    <div style="font-size: 10px; margin-top: 15px; text-align: left;">GUNSLINGERS:</div>
    <ul id="player-list" class="player-list"></ul>

    <div id="status-box" class="status-box"></div>
    <div id="action-box"></div>
  </div>

  <script>
    // --- 1. FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDYwJwLOhuOqfubY1GnHDRHyiPbhscPPWQ",
      authDomain: "unloaded-a385d.firebaseapp.com",
      databaseURL: "https://unloaded-a385d-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "unloaded-a385d",
      storageBucket: "unloaded-a385d.firebasestorage.app",
      messagingSenderId: "780910315970",
      appId: "1:780910315970:web:dc8a13f0a60ba51e492e5b",
      measurementId: "G-QSL2XQTQ0Y"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- GAME STATE VARIABLES ---
    let currentRoomCode = null;
    let playerId = "player_" + Math.random().toString(36).substring(2, 9);
    let playerName = "";
    let isHost = false;

    let stillTimer = null;
    let isStill = false;
    const STILLNESS_THRESHOLD = 2.0; // Increased threshold to withstand table bumps
    let motionSpikeCount = 0; // Anti-shake spike counter
    let lastAccel = { x: 0, y: 0, z: 0 };

    let wakeLock = null;
    let gameState = "LOBBY"; // LOBBY, COUNTDOWN, DUELING, FINISHED
    let countdownTimer = null;
    let duelStartTime = null;
    let liveTimerInterval = null;

    let stealthGlanceInterval = null;
    let isGlancing = false;

    // --- KEEP SCREEN AWAKE ---
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log("Wake Lock error:", err);
      }
    }

    // --- ROOM MANAGEMENT ---
    function createRoom() {
      playerName = document.getElementById('player-name').value.trim() || "Sheriff";
      currentRoomCode = Math.random().toString(36).substring(2, 6).toUpperCase();
      isHost = true;

      db.ref('rooms/' + currentRoomCode).set({
        createdAt: Date.now(),
        gameState: 'LOBBY',
        hostId: playerId
      }).then(() => {
        enterRoom();
      });
    }

    function joinRoom() {
      playerName = document.getElementById('player-name').value.trim() || "Outlaw";
      currentRoomCode = document.getElementById('room-code-input').value.trim().toUpperCase();

      if (!currentRoomCode) return alert("Please enter a room code!");

      db.ref('rooms/' + currentRoomCode).once('value', snapshot => {
        if (snapshot.exists()) {
          enterRoom();
        } else {
          alert("Saloon not found!");
        }
      });
    }

    function enterRoom() {
      document.getElementById('setup-screen').style.display = 'none';
      document.getElementById('room-screen').style.display = 'block';
      document.getElementById('display-room-code').innerText = currentRoomCode;

      // Register player
      db.ref(`rooms/${currentRoomCode}/players/${playerId}`).set({
        name: playerName,
        status: 'MOVING',
        isHost: isHost
      });

      // Remove player on disconnect
      db.ref(`rooms/${currentRoomCode}/players/${playerId}`).onDisconnect().remove();

      // Listen for Game State
      db.ref(`rooms/${currentRoomCode}/gameState`).on('value', snapshot => {
        gameState = snapshot.val() || 'LOBBY';
        handleGameStateChange();
      });

      // Listen for Duel Start Time
      db.ref(`rooms/${currentRoomCode}/duelStartTime`).on('value', snapshot => {
        duelStartTime = snapshot.val();
      });

      // Listen for Player updates
      db.ref(`rooms/${currentRoomCode}/players`).on('value', snapshot => {
        const players = snapshot.val();
        updatePlayerList(players);
        checkGameStateLogic(players);
      });
    }

    function updatePlayerList(players) {
      const listEl = document.getElementById('player-list');
      listEl.innerHTML = '';

      for (let id in players) {
        const p = players[id];
        const li = document.createElement('li');
        li.className = 'player-item';

        const isSelf = (id === playerId);
        if (isSelf) {
          li.classList.add('player-self');
        }

        let statusHtml = '';
        if (p.status === 'READY') {
          statusHtml = '<span class="status-ready">STILL (5s)</span>';
        } else if (p.status === 'MOVING') {
          statusHtml = '<span class="status-moving">MOVING</span>';
        } else if (p.status === 'DEAD') {
          statusHtml = `<span class="status-dead">SHOT (${p.shotTime})</span>`;
        }

        const displayName = isSelf ? `${p.name} (YOU)` : p.name;
        li.innerHTML = `<span>${displayName} ${p.isHost ? '⭐' : ''}</span> ${statusHtml}`;
        listEl.appendChild(li);
      }
    }

    // --- GAME LOGIC & STATE MACHINE ---
    function checkGameStateLogic(players) {
      if (!players) return;

      let totalPlayers = 0;
      let readyCount = 0;
      let alivePlayers = [];

      for (let id in players) {
        totalPlayers++;
        if (players[id].status === 'READY') readyCount++;
        if (players[id].status !== 'DEAD') {
          alivePlayers.push({ id: id, ...players[id] });
        }
      }

      // 1. Host triggers Countdown if everyone is ready in LOBBY state
      if (isHost && gameState === 'LOBBY' && totalPlayers > 1 && readyCount === totalPlayers) {
        startCountdown();
      }

      // 2. Check for Winner in DUELING state
      if (isHost && gameState === 'DUELING' && totalPlayers > 1 && alivePlayers.length <= 1) {
        const winner = alivePlayers.length === 1 ? alivePlayers[0] : null;
        const totalTimeElapsed = Date.now() - (duelStartTime || Date.now());
        const formattedTotalTime = formatTime(totalTimeElapsed);

        db.ref(`rooms/${currentRoomCode}`).update({
          gameState: 'FINISHED',
          winnerName: winner ? winner.name : 'NOBODY',
          survivedTime: formattedTotalTime
        });
      }

      renderStatusBox();
    }

    function handleGameStateChange() {
      const cardEl = document.getElementById('room-screen');

      if (gameState === 'DUELING') {
        startLiveTimer();
        if (!isHost) {
          startStealthMode();
        }
      } else {
        stopLiveTimer();
        stopStealthMode();
      }

      renderStatusBox();
    }

    function renderStatusBox() {
      const statusBox = document.getElementById('status-box');
      const actionBox = document.getElementById('action-box');

      if (gameState === 'COUNTDOWN') {
        statusBox.innerHTML = "<h2 style='color:#f44336;'>GET READY!<br>DRAW IN PROGRESS...</h2>";
        actionBox.innerHTML = "";
      } else if (gameState === 'DUELING') {
        statusBox.innerHTML = `
          <div id="live-timer-display" class="live-timer">00:00</div>
          <h3 style="color:#ff9800; margin: 5px 0;">DUEL IS LIVE!</h3>
          <p style="font-size:8px;">Don't touch your phone!</p>
        `;
        actionBox.innerHTML = "";
      } else if (gameState === 'FINISHED') {
        db.ref(`rooms/${currentRoomCode}`).once('value', snapshot => {
          const data = snapshot.val();
          const winnerName = data?.winnerName || 'NOBODY';
          const survivedTime = data?.survivedTime || '0s';

          statusBox.innerHTML = `
            <div class="winner-box">
              🏆 VICTORY 🏆<br><br>
              <b>${winnerName}</b><br>
              WON THE DUEL!<br><br>
              SURVIVED: ${survivedTime}
            </div>
          `;

          actionBox.innerHTML = `<button onclick="resetToLobby()">NEXT ROUND</button>`;
        });
      } else if (gameState === 'LOBBY') {
        statusBox.innerHTML = "<p>Waiting for everyone to keep their phone still for 5s...</p>";
        actionBox.innerHTML = "";
      }
    }

    function startCountdown() {
      db.ref(`rooms/${currentRoomCode}/gameState`).set('COUNTDOWN');
      
      let seconds = 3;
      countdownTimer = setInterval(() => {
        seconds--;
        if (seconds <= 0) {
          clearInterval(countdownTimer);
          const now = Date.now();
          db.ref(`rooms/${currentRoomCode}`).update({
            gameState: 'DUELING',
            duelStartTime: now
          });
        }
      }, 1000);
    }

    function resetToLobby() {
      // Reset room state for Next Round
      db.ref(`rooms/${currentRoomCode}`).update({
        gameState: 'LOBBY',
        duelStartTime: null,
        winnerName: null,
        survivedTime: null
      });

      // Reset all players to MOVING status
      db.ref(`rooms/${currentRoomCode}/players`).once('value', snapshot => {
        const players = snapshot.val();
        for (let id in players) {
          db.ref(`rooms/${currentRoomCode}/players/${id}`).update({
            status: 'MOVING',
            shotTime: null
          });
        }
      });
    }

    // --- LIVE TIMER ---
    function startLiveTimer() {
      stopLiveTimer();
      liveTimerInterval = setInterval(() => {
        if (!duelStartTime) return;
        const elapsed = Date.now() - duelStartTime;
        const timerEl = document.getElementById('live-timer-display');
        if (timerEl) {
          timerEl.innerText = formatDigitalTimer(elapsed);
        }
      }, 1000);
    }

    function stopLiveTimer() {
      if (liveTimerInterval) clearInterval(liveTimerInterval);
    }

    // --- STEALTH MODE FOR NON-HOST PLAYERS ---
    function startStealthMode() {
      document.body.classList.add('stealth-mode');
      applyStealthOpacity(true);

      // Every 60 seconds, glance for 5 seconds
      if (stealthGlanceInterval) clearInterval(stealthGlanceInterval);
      stealthGlanceInterval = setInterval(() => {
        applyStealthOpacity(false); // Show list
        setTimeout(() => {
          if (gameState === 'DUELING') {
            applyStealthOpacity(true); // Hide again
          }
        }, 5000);
      }, 60000);
    }

    function stopStealthMode() {
      document.body.classList.remove('stealth-mode');
      applyStealthOpacity(false);
      if (stealthGlanceInterval) clearInterval(stealthGlanceInterval);
    }

    function applyStealthOpacity(hide) {
      const card = document.getElementById('room-screen');
      if (hide) {
        card.classList.add('stealth-hidden');
      } else {
        card.classList.remove('stealth-hidden');
      }
    }

    // --- MOTION DETECTION ---
    function requestMotionPermission() {
      requestWakeLock();

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        DeviceMotionEvent.requestPermission()
          .then(response => {
            if (response === 'granted') {
              startMotionDetection();
            } else {
              alert("Motion permission is required to play!");
            }
          })
          .catch(console.error);
      } else {
        startMotionDetection();
      }
    }

    function startMotionDetection() {
      document.getElementById('perm-btn').style.display = 'none';
      window.addEventListener('devicemotion', handleMotion);
      resetStillness();
    }

    function handleMotion(event) {
      const accel = event.accelerationIncludingGravity;
      if (!accel) return;

      const deltaX = Math.abs(accel.x - lastAccel.x);
      const deltaY = Math.abs(accel.y - lastAccel.y);
      const deltaZ = Math.abs(accel.z - lastAccel.z);

      lastAccel = { x: accel.x, y: accel.y, z: accel.z };

      // Check if movement exceeds the threshold
      if (deltaX > STILLNESS_THRESHOLD || deltaY > STILLNESS_THRESHOLD || deltaZ > STILLNESS_THRESHOLD) {
        motionSpikeCount++;
        
        // Trigger movement only if sustained across at least 2 consecutive checks
        // (Prevents accidental shots from a single table bump)
        if (motionSpikeCount >= 2) {
          onPhoneMoved();
        }
      } else {
        // Reset the spike counter when motion settles down
        motionSpikeCount = Math.max(0, motionSpikeCount - 1);
      }
    }

    function onPhoneMoved() {
      if (gameState === 'DUELING') {
        db.ref(`rooms/${currentRoomCode}/players/${playerId}`).once('value', snapshot => {
          const currentStatus = snapshot.val()?.status;
          if (currentStatus !== 'DEAD') {
            const timeElapsedMs = Date.now() - (duelStartTime || Date.now());
            const formattedTime = formatTime(timeElapsedMs);

            db.ref(`rooms/${currentRoomCode}/players/${playerId}`).update({
              status: 'DEAD',
              shotTime: formattedTime
            });

            // Reveal screen once player is shot
            stopStealthMode();
          }
        });
      } else {
        resetStillness();
      }
    }

    function resetStillness() {
      if (isStill) {
        isStill = false;
        db.ref(`rooms/${currentRoomCode}/players/${playerId}/status`).set('MOVING');
      }

      clearTimeout(stillTimer);

      stillTimer = setTimeout(() => {
        isStill = true;
        db.ref(`rooms/${currentRoomCode}/players/${playerId}/status`).set('READY');
      }, 5000);
    }

    // --- HELPERS ---
    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      if (minutes > 0) {
        return `${minutes}m ${seconds}s`;
      }
      return `${seconds}s`;
    }

    function formatDigitalTimer(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const pad = num => String(num).padStart(2, '0');
      return `${pad(minutes)}:${pad(seconds)}`;
    }
  </script>
</body>
</html>
