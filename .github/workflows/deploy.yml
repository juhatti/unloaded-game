name: Deploy Unloaded with Git Commit Hash

on:
  push:
    branches:
      - main # or 'master' depending on your repository settings

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Git Commit Hash into HTML
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "Injecting Commit Hash: $COMMIT_HASH"
          
          # Replaces any text inside the app-version div tag with the short commit hash
          sed -i -E "s/(<div id=\"app-version\" class=\"version-tag\">)[^<]*(<\/div>)/\1$COMMIT_HASH\2/g" index.html
          
          # Output the updated line to the build logs for verification
          grep 'id="app-version"' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
