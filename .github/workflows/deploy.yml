name: Deploy Unloaded with Git Commit Hash

on:
  push:
    branches:
      - main # or 'master' depending on your repository settings

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Git Commit Hash into HTML
        run: |
          # Retrieves the exact short commit hash (e.g. 1a2b3c4)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          echo "Injecting Git Commit Hash: $COMMIT_HASH"
          
          # Replaces the 'v1.0.0-dev' placeholder with the commit hash
          sed -i "s/v1.0.0-dev/$COMMIT_HASH/g" index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
